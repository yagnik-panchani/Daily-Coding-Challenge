<template>

    <lightning-card
        title="Case Escalation Manager">

        <lightning-datatable
            key-field="Id"
            data={data}
            columns={columns}
            onrowaction={handleRowAction}>
        </lightning-datatable>

    </lightning-card>

    <template if:true={isModalOpen}>

        <section
            role="dialog"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header
                    class="slds-modal__header">

                    <h2>
                        Escalate Case
                    </h2>

                </header>

                <div
                    class="slds-modal__content
                           slds-p-around_medium">

                    Are you sure you want to
                    escalate Case

                    <b>
                        {selectedCase.CaseNumber}
                    </b>

                    ?

                </div>

                <footer
                    class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        variant="destructive"
                        label="Confirm Escalate"
                        onclick={confirmEscalate}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div
            class="slds-backdrop
                   slds-backdrop_open">
        </div>

    </template>

</template>
